<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self'; style-src 'self';" />
    <title>台股即時報價</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="full">
    <!-- 懸浮外框:底色可調透明度,文字與數字維持實心 -->
    <div class="app">
      <div class="bg"></div>
      <div class="content">
        <!-- 標題列:整條可拖曳移動視窗 -->
        <div class="titlebar" id="titlebar">
          <span class="title">台股即時報價</span>
          <span class="subtitle full-only">證交所 MIS / 期交所 MIS</span>
          <div class="caption-btns no-drag">
            <button id="btn-mode" class="cap" title="切換精簡／完整介面">精簡</button>
            <button id="btn-min" class="cap" title="最小化">—</button>
            <button id="btn-close" class="cap" title="關閉">✕</button>
          </div>
        </div>

        <!-- 工具列 -->
        <div class="toolbar full-only no-drag">
          <div class="tool-left">
            <span class="muted">透明度</span>
            <input type="range" id="opacity" min="0.15" max="1" step="0.01"
                   title="拖到最左邊幾乎全透明,最右邊為不透明" />
            <span class="muted mono" id="opacity-label">85%</span>
          </div>
          <div class="tool-right">
            <span class="muted">更新(秒)</span>
            <input type="number" id="refresh" min="3" max="60" class="num-input" />
            <label class="chk"><input type="checkbox" id="ontop" /> 釘在最上層</label>
            <button id="btn-refresh">立即更新</button>
          </div>
        </div>

        <!-- 精簡模式:代號、名稱、當日走勢秒線、現價、幅度 -->
        <div class="compact-list compact-only no-drag" id="compact"></div>

        <!-- 報價表 -->
        <div class="table-wrap full-only">
          <table class="quote-grid">
            <thead>
              <tr>
                <th class="l">類別</th>
                <th class="l">代號</th>
                <th class="l">名稱</th>
                <th>成交</th>
                <th>漲跌</th>
                <th>幅度%</th>
                <th>買進</th>
                <th>賣出</th>
                <th>開盤</th>
                <th>最高</th>
                <th>最低</th>
                <th>昨收/參考</th>
                <th>總量</th>
                <th>時間</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>

        <!-- 自選清單編輯 -->
        <div class="edit-row full-only no-drag">
          <span class="muted">新增</span>
          <input type="text" id="new-code" class="code-input"
                 placeholder="2330 / t00 / TX"
                 title="股票代號 2330、指數 t00／o00、期貨 TX／MTX" />
          <select id="new-market">
            <option value="tse">tse</option>
            <option value="otc">otc</option>
            <option value="index">index</option>
            <option value="future">future</option>
          </select>
          <button id="btn-add">加入</button>
          <button id="btn-remove" class="gap">刪除</button>
          <button id="btn-up">上移</button>
          <button id="btn-down">下移</button>
        </div>

        <!-- 狀態列 -->
        <div class="statusbar">
          <span class="muted full-only" id="status">尚未更新</span>
          <span class="err" id="error"></span>
          <span class="busy" id="busy">更新中…</span>
        </div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
